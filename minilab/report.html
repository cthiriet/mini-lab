<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} · mini-lab training report</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --base: #c3c2b7; --border: rgba(11, 11, 11, 0.10);
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
    --h0: #cde2fb; --h1: #b7d3f6; --h2: #9ec5f4; --h3: #86b6ef; --h4: #6da7ec;
    --h5: #5598e7; --h6: #256abf; --h7: #184f95; --h8: #0d366b;
    --h-ink-lo: #0b0b0b; --h-ink-hi: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --base: #383835; --border: rgba(255, 255, 255, 0.10);
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
      /* sequential ramp reversed: low values recede into the dark surface */
      --h0: #0d366b; --h1: #104281; --h2: #184f95; --h3: #1c5cab; --h4: #256abf;
      --h5: #2a78d6; --h6: #5598e7; --h7: #86b6ef; --h8: #b7d3f6;
      --h-ink-lo: #ffffff; --h-ink-hi: #0b0b0b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1120px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 28px; margin: 0 0 4px; letter-spacing: -0.01em; }
  h2 { font-size: 20px; margin: 40px 0 12px; }
  h3 { font-size: 16px; margin: 28px 0 8px; }
  .muted { color: var(--muted); } .small { font-size: 13px; }
  .card, .tile, .table-wrap, .chart { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-top: 20px; }
  .tile { padding: 14px 16px; }
  .tile-label { color: var(--ink-2); font-size: 13px; }
  .tile-value { font-size: 26px; font-weight: 600; margin-top: 2px; }
  .table-wrap { overflow-x: auto; }
  table { border-collapse: separate; border-spacing: 2px; width: 100%; font-size: 13px; }
  th, td { padding: 6px 10px; text-align: left; white-space: nowrap; }
  thead th { color: var(--ink-2); font-weight: 600; }
  thead th + th { text-align: center; }
  tbody th { font-weight: 400; color: var(--ink-2); }
  td { text-align: center; font-variant-numeric: tabular-nums; border-radius: 4px; min-width: 72px; }
  td.na { color: var(--muted); }
  .h0 { background: var(--h0); color: var(--h-ink-lo); } .h1 { background: var(--h1); color: var(--h-ink-lo); }
  .h2 { background: var(--h2); color: var(--h-ink-lo); } .h3 { background: var(--h3); color: var(--h-ink-lo); }
  .h4 { background: var(--h4); color: var(--h-ink-lo); } .h5 { background: var(--h5); color: var(--h-ink-lo); }
  .h6 { background: var(--h6); color: var(--h-ink-hi); } .h7 { background: var(--h7); color: var(--h-ink-hi); }
  .h8 { background: var(--h8); color: var(--h-ink-hi); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .h5 { color: var(--h-ink-lo); }
  }
  .stage { margin-top: 36px; }
  .stage header p { margin: 0; color: var(--ink-2); }
  .stage .meta { color: var(--muted); font-size: 13px; }
  .charts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 12px; }
  .chart { margin: 0; padding: 12px 12px 8px; min-width: 0; }
  .chart.wide { grid-column: 1 / -1; }
  figcaption { font-weight: 600; font-size: 14px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 4px 0 2px; font-size: 13px; color: var(--ink-2); }
  .key { display: inline-block; width: 14px; height: 2px; border-radius: 1px; vertical-align: middle; margin-right: 6px; }
  .plot { position: relative; }
  .plot svg { display: block; width: 100%; overflow: visible; }
  .plot svg:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; border-radius: 4px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .baseline { stroke: var(--base); stroke-width: 1; }
  .axis { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .cross { stroke: var(--base); stroke-width: 1; }
  .tip { position: absolute; top: 4px; pointer-events: none; background: var(--surface); border: 1px solid var(--border);
         border-radius: 8px; padding: 6px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.12); white-space: nowrap; z-index: 2; }
  .tip .x { color: var(--muted); margin-bottom: 2px; }
  .tip .row { display: flex; align-items: center; gap: 6px; }
  .tip strong { font-variant-numeric: tabular-nums; }
  .tip .name { color: var(--ink-2); }
  details { margin-top: 4px; font-size: 12px; color: var(--ink-2); }
  details table { font-size: 12px; }
  details td { min-width: 0; }
  .samples { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
  .samples li { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
  .prompt { font-weight: 600; }
  .sample { margin: 6px 0 0; white-space: pre-wrap; color: var(--ink-2); font-size: 14px; }
  @media (max-width: 720px) { .charts { grid-template-columns: minmax(0, 1fr); } h1 { font-size: 24px; } }
</style>
</head>
<body>
<main>
  <p class="muted small">mini-lab · training report</p>
  <h1>{{TITLE}}</h1>
  {{SUMMARY}}
  <div id="charts"></div>
  {{SAMPLES}}
</main>
<script type="application/json" id="report-data">{{DATA}}</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById("report-data").textContent);
const STAGE_INFO = {
  pretrain: ["Pretraining", "Next-token prediction on TinyStories and arithmetic worksheets."],
  midtrain: ["Midtraining", "The chat format and skills: conversations, scratchpad reasoning, calculator calls."],
  sft: ["Supervised fine-tuning", "Instruction following on a small curated set; loss on the assistant's tokens only."],
  rl: ["Reinforcement learning (GRPO)", "Several answers per question, rewarded when the final answer is right."],
};
const FORMAT = {
  loss: v => v.toFixed(3),
  pct: v => Math.round(v * 100) + "%",
  sci: v => v.toExponential(1),
  compact: v => {
    const a = Math.abs(v);
    if (a >= 1e9) return +(v / 1e9).toFixed(1) + "B";
    if (a >= 1e6) return +(v / 1e6).toFixed(1) + "M";
    if (a >= 1e3) return +(v / 1e3).toFixed(1) + "k";
    return (Math.round(v * 10) / 10).toString();
  },
};
const TICK = { loss: v => +v.toPrecision(2) + "", pct: FORMAT.pct, sci: FORMAT.sci, compact: FORMAT.compact };
const SVG_NS = "http://www.w3.org/2000/svg";

function el(tag, attrs = {}, text) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  if (text !== undefined) node.textContent = text;
  return node;
}
function svg(tag, attrs = {}) {
  const node = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  return node;
}
function niceTicks(lo, hi, count) {
  const span = hi - lo || Math.abs(hi) || 1;
  const raw = span / count, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw);
  const ticks = [];
  for (let t = Math.floor(lo / step) * step; t <= hi + step * 1e-9; t += step) ticks.push(+t.toPrecision(12));
  if (ticks[ticks.length - 1] < hi) ticks.push(+(ticks[ticks.length - 1] + step).toPrecision(12));
  return ticks;
}
function logTicks(lo, hi) {
  const all = [];
  for (let e = Math.floor(Math.log10(lo)); e <= Math.ceil(Math.log10(hi)); e++)
    for (const m of [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 7, 8]) all.push(+(m * Math.pow(10, e)).toPrecision(3));
  let ticks = all.filter(t => t >= lo && t <= hi);
  while (ticks.length > 6) ticks = ticks.filter((_, i) => i % 2 === 0);
  return ticks;
}
function nearest(pts, x) {  // index of the point whose x is closest (pts sorted by x)
  let lo = 0, hi = pts.length - 1;
  while (lo < hi) { const mid = (lo + hi) >> 1; if (pts[mid][0] < x) lo = mid + 1; else hi = mid; }
  return lo > 0 && Math.abs(pts[lo - 1][0] - x) <= Math.abs(pts[lo][0] - x) ? lo - 1 : lo;
}

const charts = [];

function addChart(container, spec) {
  spec.series = spec.series.filter(s => s.pts.length);
  if (!spec.series.length) return;
  const fig = el("figure", { class: "chart" + (spec.wide ? " wide" : "") });
  fig.append(el("figcaption", {}, spec.title));
  if (spec.series.length > 1 || spec.legend) {
    const legend = el("div", { class: "legend" });
    for (const s of spec.series) {
      const item = el("span");
      item.append(el("span", { class: "key", style: `background: var(--s${s.slot})` }), document.createTextNode(s.name));
      legend.append(item);
    }
    fig.append(legend);
  }
  const plot = el("div", { class: "plot" });
  fig.append(plot);
  fig.append(dataTable(spec));
  container.append(fig);
  charts.push([plot, spec]);
  draw(plot, spec);
}

function dataTable(spec) {
  const details = el("details");
  details.append(el("summary", {}, "Data"));
  details.addEventListener("toggle", () => {
    if (!details.open || details.querySelector("table")) return;
    const xs = [...new Set(spec.series.flatMap(s => s.pts.map(p => p[0])))].sort((a, b) => a - b);
    const stride = Math.max(1, Math.ceil(xs.length / 40));
    const table = el("table"), head = el("tr");
    head.append(el("th", {}, "step"));
    for (const s of spec.series) head.append(el("th", {}, s.name));
    table.append(head);
    xs.filter((_, i) => i % stride === 0 || i === xs.length - 1).forEach(x => {
      const tr = el("tr");
      tr.append(el("td", {}, String(x)));
      for (const s of spec.series) {
        const p = s.pts.find(q => q[0] === x);
        tr.append(el("td", {}, p ? FORMAT[spec.y](p[1]) : ""));
      }
      table.append(tr);
    });
    const wrap = el("div", { class: "table-wrap" });
    wrap.append(table);
    details.append(wrap);
  });
  return details;
}

function draw(plot, spec) {
  plot.replaceChildren();
  const W = Math.max(plot.clientWidth, 240), H = spec.wide ? 240 : 170;
  const m = { l: 46, r: 12, t: 8, b: 24 };
  const pts = spec.series.flatMap(s => s.pts);
  let x0 = Math.min(...pts.map(p => p[0])), x1 = Math.max(...pts.map(p => p[0]));
  if (x0 === x1) x1 = x0 + 1;
  let ys = pts.map(p => p[1]), y0, y1, yTicks, toY;
  const innerH = H - m.t - m.b, innerW = W - m.l - m.r;
  if (spec.log) {
    ys = ys.filter(y => y > 0);
    const pad = (Math.log(Math.max(...ys)) - Math.log(Math.min(...ys))) * 0.05 || 0.1;
    y0 = Math.exp(Math.log(Math.min(...ys)) - pad); y1 = Math.exp(Math.log(Math.max(...ys)) + pad);
    yTicks = logTicks(y0, y1);
    toY = y => m.t + (1 - (Math.log(y) - Math.log(y0)) / (Math.log(y1) - Math.log(y0))) * innerH;
  } else {
    [y0, y1] = spec.domain || [Math.min(0, ...ys), Math.max(...ys)];
    yTicks = niceTicks(y0, y1, 4);
    [y0, y1] = spec.domain || [yTicks[0], yTicks[yTicks.length - 1]];
    toY = y => m.t + (1 - (y - y0) / (y1 - y0 || 1)) * innerH;
  }
  const toX = x => m.l + (x - x0) / (x1 - x0) * innerW;
  const root = svg("svg", { viewBox: `0 0 ${W} ${H}`, height: H, tabindex: 0, role: "img", "aria-label": spec.title });

  for (const t of yTicks) {
    const y = toY(t);
    root.append(svg("line", { class: "grid", x1: m.l, x2: W - m.r, y1: y, y2: y }));
    const label = svg("text", { class: "axis", x: m.l - 6, y: y + 3.5, "text-anchor": "end" });
    label.textContent = TICK[spec.y](t);
    root.append(label);
  }
  for (const t of niceTicks(x0, x1, W < 420 ? 3 : 5).filter(t => t >= x0 && t <= x1)) {
    const label = svg("text", { class: "axis", x: toX(t), y: H - 6, "text-anchor": "middle" });
    label.textContent = FORMAT.compact(t);
    root.append(label);
  }
  root.append(svg("line", { class: "baseline", x1: m.l, x2: W - m.r, y1: H - m.b, y2: H - m.b }));

  for (const s of spec.series) {
    const d = s.pts.filter(p => !spec.log || p[1] > 0).map((p, i) => `${i ? "L" : "M"}${toX(p[0]).toFixed(1)},${toY(p[1]).toFixed(1)}`).join("");
    root.append(svg("path", { d, fill: "none", style: `stroke: var(--s${s.slot})`, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
    if (s.markers) for (const p of s.pts)
      root.append(svg("circle", { cx: toX(p[0]), cy: toY(p[1]), r: 4, style: `fill: var(--s${s.slot}); stroke: var(--surface)`, "stroke-width": 2 }));
  }

  // Hover layer: a crosshair snaps to the nearest step; the tooltip lists every series there.
  const cross = svg("line", { class: "cross", y1: m.t, y2: H - m.b, visibility: "hidden" });
  const dots = spec.series.map(s => svg("circle", { r: 4, style: `fill: var(--s${s.slot}); stroke: var(--surface)`, "stroke-width": 2, visibility: "hidden" }));
  root.append(cross, ...dots);
  const tip = el("div", { class: "tip", hidden: "" });
  const xs = [...new Set(pts.map(p => p[0]))].sort((a, b) => a - b).map(x => [x]);
  let current = xs.length - 1;

  function show(i) {
    current = Math.max(0, Math.min(xs.length - 1, i));
    const x = xs[current][0], px = toX(x);
    cross.setAttribute("x1", px); cross.setAttribute("x2", px); cross.setAttribute("visibility", "visible");
    tip.replaceChildren(el("div", { class: "x" }, "step " + x.toLocaleString("en-US")));
    spec.series.forEach((s, k) => {
      const p = s.pts[nearest(s.pts, x)];
      dots[k].setAttribute("cx", toX(p[0])); dots[k].setAttribute("cy", toY(p[1])); dots[k].setAttribute("visibility", "visible");
      const row = el("div", { class: "row" });
      row.append(el("span", { class: "key", style: `background: var(--s${s.slot})` }), el("strong", {}, FORMAT[spec.y](p[1])),
                 el("span", { class: "name" }, s.name + (p[0] !== x ? ` (step ${p[0]})` : "")));
      tip.append(row);
    });
    tip.hidden = false;
    const left = px + 12 + tip.offsetWidth > W ? px - 12 - tip.offsetWidth : px + 12;
    tip.style.left = Math.max(0, left) + "px";
  }
  function hide() {
    tip.hidden = true;
    cross.setAttribute("visibility", "hidden");
    dots.forEach(d => d.setAttribute("visibility", "hidden"));
  }
  root.addEventListener("pointermove", e => {
    const box = root.getBoundingClientRect();
    const x = x0 + ((e.clientX - box.left) * (W / box.width) - m.l) / innerW * (x1 - x0);
    show(nearest(xs, x));
  });
  root.addEventListener("pointerleave", hide);
  root.addEventListener("focus", () => show(current));
  root.addEventListener("blur", hide);
  root.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft") { show(current - 1); e.preventDefault(); }
    if (e.key === "ArrowRight") { show(current + 1); e.preventDefault(); }
  });
  plot.append(root, tip);
}

function series(rows, key, name, slot, markers = false) {
  return { name, slot, markers, pts: rows.filter(r => typeof r[key] === "number").map(r => [r.step, r[key]]) };
}

function build() {
  const container = document.getElementById("charts");
  const runs = DATA.runs, compare = runs.length > 1;
  const heading = el("h2", {}, "Training curves");
  container.append(heading, el("p", { class: "muted small" }, "Hover a chart (or focus it and use the arrow keys) to read values. Loss axes are logarithmic."));
  for (const stage of DATA.stages) {
    const present = runs.filter(r => r.stages[stage]);
    if (!present.length) continue;
    const [title, blurb] = STAGE_INFO[stage];
    const section = el("section", { class: "stage" });
    const header = el("header");
    header.append(el("h3", {}, title), el("p", {}, blurb));
    if (!compare) {
      const meta = present[0].stages[stage].meta, bits = [];
      if (meta.steps) bits.push(meta.steps.toLocaleString("en-US") + " steps");
      if (meta.tokens) bits.push(FORMAT.compact(meta.tokens) + " tokens");
      if (meta.wall_clock_s) bits.push((meta.wall_clock_s / 60).toFixed(1) + " min");
      if (meta.device) bits.push("on " + meta.device);
      header.append(el("p", { class: "meta" }, bits.join(" · ")));
    }
    section.append(header);
    const grid = el("div", { class: "charts" });
    section.append(grid);
    container.append(section);

    if (stage === "rl") {
      if (compare) {
        addChart(grid, { legend: true, title: "Mean reward", y: "pct", domain: [0, 1], wide: true, series: present.map(r => series(r.stages.rl.train, "reward", r.name, runs.indexOf(r) + 1)) });
        addChart(grid, { legend: true, title: "Answer length (tokens)", y: "compact", series: present.map(r => series(r.stages.rl.train, "completion_len", r.name, runs.indexOf(r) + 1)) });
      } else {
        const rows = present[0].stages.rl.train;
        addChart(grid, { title: "Mean reward (share of correct answers)", y: "pct", domain: [0, 1], wide: true, series: [series(rows, "reward", "reward", 1)] });
        addChart(grid, { title: "Answer length (tokens)", y: "compact", series: [series(rows, "completion_len", "tokens", 1)] });
        addChart(grid, { title: "Questions with a learning signal", y: "pct", domain: [0, 1], series: [series(rows, "informative", "informative", 1)] });
        if (rows.some(r => r.kl)) addChart(grid, { title: "KL divergence to the SFT model", y: "loss", series: [series(rows, "kl", "kl", 1)] });
      }
      continue;
    }
    if (compare) {
      addChart(grid, { legend: true, title: "Training loss", y: "loss", log: true, series: present.map(r => series(r.stages[stage].train, "loss", r.name, runs.indexOf(r) + 1)) });
      addChart(grid, { legend: true, title: "Validation loss", y: "loss", log: true, series: present.map(r => series(r.stages[stage].val, "val_loss", r.name, runs.indexOf(r) + 1, true)) });
    } else {
      const st = present[0].stages[stage];
      addChart(grid, { title: "Loss", y: "loss", log: true, wide: true, series: [series(st.train, "loss", "training loss", 1), series(st.val, "val_loss", "validation loss", 2, true)] });
      addChart(grid, { title: "Learning rate", y: "sci", series: [series(st.train, "lr", "learning rate", 1)] });
      addChart(grid, { title: "Throughput (tokens/s)", y: "compact", series: [series(st.train, "tok_per_s", "tokens/s", 1)] });
    }
  }
}

build();
let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => charts.forEach(([plot, spec]) => draw(plot, spec)), 120);
});
</script>
</body>
</html>
