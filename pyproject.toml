[project]
name = "minilab"
version = "0.1.0"
description = "A minimal, CPU-friendly recreation of an AI lab: train, serve and bill a tiny LLM."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Clément Thiriet" }]
keywords = ["llm", "education", "gpt", "rlhf", "grpo", "openai-compatible", "inference"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.5",
    "numpy>=1.26",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "stripe>=10.0",
]

[project.urls]
Homepage = "https://github.com/cthiriet/mini-lab"
Documentation = "https://github.com/cthiriet/mini-lab/tree/main/docs"
Issues = "https://github.com/cthiriet/mini-lab/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "openai>=1.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["minilab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# On Linux (Docker, CI), install the CPU-only PyTorch build instead of the multi-GB CUDA one.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
