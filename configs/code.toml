# mini-code: a tiny coding agent for opencode, trained from scratch on a toy world of small
# Python projects (minilab/data/code.py). Two stages: pretraining on Python (files, docs, bugs
# and fixes), then SFT on agent transcripts that use opencode's tools.
#
#   bash speedrun.sh code
seed = 0
optimizer = "muon"

[data]
world = "code"              # minilab/data/code.py instead of TinyStories + arithmetic

[tokenizer]
vocab_size = 2048           # the toy world's vocabulary is small: merges run out near 2,300
sample = 4000               # SFT conversations and as many pretraining documents

[model]                     # 5.3M parameters
block_size = 1024           # opencode's requests, cut down by the chat template, and 2 tasks in a row
n_layer = 6
n_head = 4
n_embd = 256

[pretrain]                  # Python, packed, loss on every token
steps = 1500
batch_size = 16
lr = 3e-3
warmup = 50
weight_decay = 0.1
eval_every = 250
log_every = 25
val_batches = 10

[sft]                       # agent transcripts, one per row, loss on the assistant's turns only
size = 80000                # conversations, generated once (every tool call runs for real) -> data/code/
steps = 2500
batch_size = 32
lr = 1e-3
warmup = 50
weight_decay = 0.1
eval_every = 250
log_every = 25
val_batches = 10
mix = { list_files = 0.04, find_def = 0.04, show_file = 0.04, explain = 0.05, run = 0.06, run_tests = 0.05, create_func = 0.09, create_script = 0.04, rename = 0.07, change_const = 0.06, add_func = 0.08, fix_test = 0.13, fix_crash = 0.08, session = 0.10, chat = 0.04, title = 0.03 }

[eval]
n_per_kind = 50             # new tasks of each of the 13 kinds, played end to end in a Docker sandbox
n_chat = 30                 # small talk, and as many title requests
max_steps = 8               # tool calls per task
max_new_tokens = 384        # per model turn: room for a whole file in a write call
batch = 32
ppl_docs = 400

[release]
family = "mini-code"
description = "a coding agent for opencode that explores, creates, edits and fixes small Python projects with tools."
truncation = "auto"         # the server fits long agent requests into the 1,024-token context
temperature = 0.0           # when a request sets none (opencode never does): greedy, like the eval
